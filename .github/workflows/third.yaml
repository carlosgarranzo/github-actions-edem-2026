name: Welcome to the party

on:
  workflow_dispatch:
    inputs:
      thename:
        description: 'What is your name?'
        required: true
        type: string

jobs:
  say_hello:
    name: "Let's greet the user!"
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "Hello there, ${{ inputs.thename }}!"