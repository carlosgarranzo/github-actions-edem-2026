name: Welcome to the party (third)

on:
  workflow_dispatch:
    inputs:
      thename: Carlos
        description: 'What is your name?'
        required: true
        type: string

jobs:
  say_hello:
    name: "Let's greet the user!"
    runs-on: ubuntu-latest

    steps:
      - name: Greet the user
        run: echo "Hello there, ${{ inputs.thename }}!"